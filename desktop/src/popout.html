<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>MirrorLink USB - Tab 2</title>
    <style>
        :root {
            --bg-base: #090c10;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .win-title {
            font-size: 14px;
            font-weight: 700;
            margin: 0;
        }

        .badge-hq {
            background: rgba(47, 129, 247, 0.18);
            border: 1px solid rgba(47, 129, 247, 0.4);
            color: #58a6ff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 10px;
        }

        .badge-res {
            background: rgba(35, 134, 54, 0.18);
            border: 1px solid rgba(35, 134, 54, 0.4);
            color: #3fb950;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 10px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #21262d;
            color: var(--text-main);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            border-color: #8b949e;
            background: #30363d;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: #040608;
            overflow: hidden;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
            background: #000;
            image-rendering: auto;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 5px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .fps-counter {
            font-family: monospace;
            color: #58a6ff;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <header>
        <div class="title-group">
            <h2 class="win-title">📱 Tab 2 (Detached Window)</h2>
            <span class="badge-hq">⚡ High Quality</span>
            <span class="badge-res hidden" id="resBadge">1080p</span>
        </div>
        <div class="btn-group">
            <button id="btnFullscreen" title="Toggle Fullscreen">⛶ Fullscreen</button>
            <button id="btnDock" title="Close this window and return to main window tab">↙ Dock Back</button>
        </div>
    </header>

    <main>
        <canvas id="popoutCanvas"></canvas>
    </main>

    <footer>
        <span id="status">Active High Quality Screen Mirror</span>
        <span id="fpsDisplay" class="fps-counter">0 FPS</span>
    </footer>

    <script src="popout.js"></script>
</body>

</html>
