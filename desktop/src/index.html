<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>MirrorLink USB</title>
    <style>
        :root {
            --bg-base: #0d1117;
            --bg-card: #161b22;
            --bg-active: #21262d;
            --border-color: #30363d;
            --accent: #2f81f7;
            --accent-hover: #388bfd;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --green: #238636;
            --green-badge: #1f6feb;
            --danger: #da3633;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            height: 36px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .brand-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: var(--text-main);
            margin: 0;
        }

        .badge-hq {
            background: rgba(47, 129, 247, 0.18);
            border: 1px solid rgba(47, 129, 247, 0.4);
            color: #58a6ff;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-res {
            background: rgba(35, 134, 54, 0.18);
            border: 1px solid rgba(35, 134, 54, 0.4);
            color: #3fb950;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .stream-settings {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .stream-settings select {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-active);
            color: var(--text-main);
        }

        button {
            padding: 7px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-active);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            border-color: #8b949e;
            background: #30363d;
        }

        button.btn-primary {
            background: var(--green);
            border-color: #2ea043;
            color: #fff;
        }

        button.btn-primary:hover {
            background: #2ea043;
        }

        button.btn-danger {
            background: rgba(218, 54, 51, 0.15);
            border-color: rgba(218, 54, 51, 0.5);
            color: #f85149;
        }

        button.btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        /* Main Workspace Views */
        .workspace {
            flex: 1;
            display: flex;
            background: #090c10;
            position: relative;
            overflow: hidden;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .view-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .screen-pane {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #040608;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .pane-header {
            position: absolute;
            top: 10px;
            left: 12px;
            z-index: 10;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pane-header span.dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3fb950;
        }

        .screen-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
            background: #000;
            image-rendering: auto;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            /* Smooth size transition on orientation change */
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s ease;
        }

        /* Portrait mode: pane fills height, natural narrow column */
        .screen-pane.orient-portrait {
            flex: 0 0 auto;
            width: auto;
            height: 100%;
            max-width: 55%;
        }

        /* Landscape mode: pane fills width, short wide row */
        .screen-pane.orient-landscape {
            flex: 1 1 auto;
            width: 100%;
            height: auto;
            max-width: 100%;
        }

        /* Orientation change flash overlay */
        .rotate-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(9, 12, 16, 0.82);
            backdrop-filter: blur(6px);
            z-index: 20;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .rotate-overlay.visible {
            opacity: 1;
        }

        .rotate-icon {
            font-size: 36px;
            animation: spinIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes spinIn {
            from { transform: rotate(-90deg) scale(0.6); opacity: 0; }
            to   { transform: rotate(0deg)  scale(1);   opacity: 1; }
        }

        .rotate-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        /* Orientation badge on pane-header */
        .orient-badge {
            background: rgba(47, 129, 247, 0.15);
            border: 1px solid rgba(47, 129, 247, 0.35);
            color: #58a6ff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.25s ease;
        }

        .orient-badge.landscape {
            background: rgba(35, 134, 54, 0.15);
            border-color: rgba(35, 134, 54, 0.35);
            color: #3fb950;
        }

        .detached-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            gap: 16px;
        }

        .detached-icon {
            font-size: 44px;
            color: #58a6ff;
            opacity: 0.9;
        }

        .detached-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
        }

        .detached-desc {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 320px;
            margin: 0;
        }

        /* Status Footer */
        footer {
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 7px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        #statusText {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d29922;
            flex-shrink: 0;
        }

        .status-dot.active {
            background: #238636;
        }

        .status-dot.error {
            background: #da3633;
        }

        .fps-counter {
            font-family: monospace;
            font-size: 11px;
            color: #58a6ff;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- Top Header -->
    <header>
        <div class="brand-section">
            <img src="assets/logo.png" alt="MirrorLink USB" class="brand-logo" id="brandLogo">
            <span class="badge-hq" id="hqBadge">Screen sharing</span>
            <span class="badge-res hidden" id="resBadge">1080p</span>
        </div>
        <div class="stream-settings" aria-label="Screen sharing quality">
            <label for="resolutionSelect">Size</label>
            <select id="resolutionSelect" title="Decoded output size; applied on next connection">
                <option value="auto">Auto</option>
                <option value="1920">1920 px</option>
                <option value="1280">1280 px</option>
                <option value="960">960 px</option>
                <option value="640">640 px</option>
            </select>
            <label for="fpsSelect">FPS</label>
            <select id="fpsSelect" title="Maximum decoded output FPS; applied on next connection">
                <option value="auto">Auto</option>
                <option value="60">60</option>
                <option value="30">30</option>
                <option value="24">24</option>
                <option value="15">15</option>
            </select>
        </div>
        <div class="btn-group">
            <button id="connect" class="btn-primary">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M7 1v4H5L8 9l3-4H9V1H7zm1 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" />
                </svg>
                Connect by USB
            </button>
            <button id="disconnect" class="btn-danger hidden">Disconnect</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
        <div class="view-container" id="viewContainer">
            <!-- Screen Pane 1 (Tab 1) -->
            <div class="screen-pane" id="pane1">
                <div class="pane-header">
                    <span class="dot"></span>
                    <span>Screen A</span>
                    <span class="orient-badge" id="orientBadge1">Portrait</span>
                </div>
                <!-- Rotation transition overlay -->
                <div class="rotate-overlay" id="rotateOverlay1">
                    <span class="rotate-icon" id="rotateIcon1">🔄</span>
                    <span class="rotate-label" id="rotateLabel1">Switching to Landscape…</span>
                </div>
                <canvas id="screen1" class="screen-canvas"></canvas>
            </div>

            <!-- Screen Pane 2 (Tab 2) -->
            <div class="screen-pane hidden" id="pane2">
                <div class="pane-header">
                    <span class="dot"></span>
                    <span>Tab 2 (Screen B)</span>
                </div>
                <!-- Docked State: Canvas -->
                <canvas id="screen2" class="screen-canvas"></canvas>
                <!-- Detached State (When popped out into separate window) -->
                <div class="detached-state hidden" id="pane2Detached">
                    <div class="detached-icon">⧉</div>
                    <h3 class="detached-title">Tab 2 is open in a separate window</h3>
                    <p class="detached-desc">The high quality stream is actively displaying in an independent floating window.</p>
                    <div class="btn-group">
                        <button id="btnFocusPopout" class="btn-primary">Focus Window</button>
                        <button id="btnDockBack">Dock Back Here</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Status Bar -->
    <footer>
        <div id="statusText">
            <span class="status-dot" id="statusDot"></span>
            <span id="status">Connect an Android phone by USB and tap "Start sharing" in the phone app.</span>
        </div>
        <div id="streamStats" class="fps-counter hidden">
            <span id="fpsDisplay">0 FPS</span>
        </div>
    </footer>

    <script src="renderer.js"></script>
</body>

</html>
